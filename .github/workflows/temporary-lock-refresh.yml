name: Temporary audited Next.js lock refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-patch-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Resolve patched dependency and refresh lockfile with registry integrity hashes
        run: |
          corepack pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit only lockfile change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --staged --quiet; then
            git commit -m "Regenerate lockfile for Next.js 16.4.1 security update"
            git push origin HEAD:main
          fi
