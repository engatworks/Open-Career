name: Temporary Zod dependency lock refresh
on:
  push:
    branches:
      - fix/campaign-delivery-reporting-20261024
    paths:
      - '.github/workflows/temporary-zod-lock-refresh.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Regenerate lockfile without lifecycle scripts
        run: corepack pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit only regenerated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --staged --quiet; then
            git commit -m "Regenerate lockfile for patched Zod 4.6.6"
            git push origin HEAD:fix/campaign-delivery-reporting-20261024
          fi
