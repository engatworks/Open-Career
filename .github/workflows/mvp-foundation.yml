name: Open Career MCP MVP regression
on:
  pull_request:
    paths:
      - 'lib/mvp-*.mjs'
      - 'tests/mvp-*.test.mjs'
      - 'drizzle/0003_mvp_foundation.sql'
      - 'db/schema.ts'
      - 'app/mcp/route.ts'
      - 'app/api/mvp/**'
      - 'app/consent/**'
      - '.github/workflows/mvp-foundation.yml'
  push:
    branches: [feat/mvp-plugin-authorization-foundation]
permissions:
  contents: read
  issues: write
jobs:
  mvp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and consent/application tests
        run: |
          node --check lib/mvp-consent.mjs
          node --check lib/mvp-workflow.mjs
          node --test tests/mvp-consent.test.mjs tests/mvp-workflow.test.mjs tests/private-owner-security.test.mjs
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript verification
        id: typecheck
        continue-on-error: true
        run: pnpm exec tsc --noEmit > /tmp/mvp-tsc.log 2>&1
      - name: Report compiler diagnostic on the draft PR
        if: ${{ steps.typecheck.outcome == 'failure' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf 'TypeScript diagnostics from automated MVP check:\n\n' > /tmp/mvp-tsc-comment
          printf '%s\n' '~~~' >> /tmp/mvp-tsc-comment
          head -c 14000 /tmp/mvp-tsc.log >> /tmp/mvp-tsc-comment
          printf '\n%s\n' '~~~' >> /tmp/mvp-tsc-comment
          gh issue comment "$PR_NUMBER" --body-file /tmp/mvp-tsc-comment
      - name: Fail if TypeScript verification failed
        if: ${{ steps.typecheck.outcome == 'failure' }}
        run: |
          if [ -f /tmp/mvp-tsc.log ]; then cat /tmp/mvp-tsc.log; fi
          exit 1


      - name: Run original cloud and MVP integration suites
        run: node --test tests/cloud.test.mjs tests/mvp-consent.test.mjs tests/mvp-workflow.test.mjs tests/private-owner-security.test.mjs
      - name: Validate Drizzle migration chain
        run: pnpm exec drizzle-kit check
