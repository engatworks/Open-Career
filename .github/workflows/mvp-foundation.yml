name: Open Career MCP MVP regression
on:
  pull_request:
    paths:
      - 'lib/mvp-*.mjs'
      - 'tests/mvp-*.test.mjs'
      - 'drizzle/0003_mvp_foundation.sql'
      - 'db/schema.ts'
      - 'app/mcp/route.ts'
      - 'app/api/mvp/**'
      - 'app/api/[...path]/route.ts'
      - 'app/consent/**'
      - '.github/workflows/mvp-foundation.yml'
  push:
    branches: [feat/mvp-plugin-authorization-foundation]
permissions:
  contents: read
jobs:
  mvp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and consent/application tests
        run: |
          node --check lib/mvp-consent.mjs
          node --check lib/mvp-workflow.mjs
          node --test tests/mvp-consent.test.mjs tests/mvp-workflow.test.mjs
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript verification
        run: pnpm exec tsc --noEmit
