version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 6
    groups:
      production-minor:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
